<svg class="figsvg" viewBox="0 0 700 330" role="img" aria-label="AHT(平均処理時間)の計算。通話時間、保留時間、後処理時間を足した合計を、通話件数で割る。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-aht-breakdown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="10" y="20" width="170" height="80" rx="10"/><text class="bt" x="95.0" y="66.0" text-anchor="middle" font-size="18">通話時間</text><text class="bt" x="195" y="66" text-anchor="middle" font-size="22">＋</text><rect class="b" x="210" y="20" width="170" height="80" rx="10"/><text class="bt" x="295.0" y="66.0" text-anchor="middle" font-size="18">保留時間</text><text class="bt" x="395" y="66" text-anchor="middle" font-size="22">＋</text><rect class="b" x="410" y="20" width="280" height="80" rx="10"/><text class="bt" x="550.0" y="46" text-anchor="middle" font-size="18">後処理時間(ACW)</text><text class="bd" x="550.0" y="70" text-anchor="middle" font-size="14.5">通話後の記録・分類・CRM更新など</text><line class="ar" x1="350" y1="104" x2="350" y2="146" marker-end="url(#ah-aht-breakdown)"/><rect class="b head" x="150" y="150" width="400" height="60" rx="10"/><text class="bt" x="350.0" y="186.0" text-anchor="middle" font-size="19">合計 ÷ 通話件数 = AHT</text><text class="bd" x="10" y="246" text-anchor="start" font-size="14.5">・後処理の間、オペレーターは次の問い合わせを受けられない</text><text class="bd" x="10" y="270" text-anchor="start" font-size="14.5">・AHTは短いほど良いとは限らない。一次解決率や顧客満足度とあわせて見る</text><text class="bd" x="10" y="296" text-anchor="start" font-size="13.5">※一般的な計算式。通話時間の範囲などは、会社や製品によって異なることがある</text></svg>