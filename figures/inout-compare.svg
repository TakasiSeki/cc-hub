<svg class="figsvg" viewBox="0 0 700 428" role="img" aria-label="インバウンドとアウトバウンドの比較。業務の例、顧客との距離、研修の期間、指標の4つの観点で並べた表。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-inout-compare" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b head" x="130" y="10" width="270" height="50" rx="10"/><text class="bt" x="265.0" y="41.0" text-anchor="middle" font-size="18">インバウンド(受信)</text><rect class="b head2" x="420" y="10" width="270" height="50" rx="10"/><text class="bt" x="555.0" y="41.0" text-anchor="middle" font-size="18">アウトバウンド(発信)</text><text class="bt" x="10" y="120.0" text-anchor="start" font-size="15">業務の例</text><rect class="b" x="130" y="76" width="270" height="78" rx="10"/><text class="bd" x="265" y="110.0" text-anchor="middle" font-size="14.5">問い合わせ、申し込み、</text><text class="bd" x="265" y="130.0" text-anchor="middle" font-size="14.5">受注、クレーム</text><rect class="b" x="420" y="76" width="270" height="78" rx="10"/><text class="bd" x="555" y="110.0" text-anchor="middle" font-size="14.5">新商品の案内、アポ獲得、</text><text class="bd" x="555" y="130.0" text-anchor="middle" font-size="14.5">フォロー、アンケート</text><text class="bt" x="10" y="210.0" text-anchor="start" font-size="15">顧客との距離</text><rect class="b" x="130" y="166" width="270" height="78" rx="10"/><text class="bd" x="265" y="200.0" text-anchor="middle" font-size="14.5">近い傾向</text><text class="bd" x="265" y="220.0" text-anchor="middle" font-size="14.5">(顧客から連絡してくる)</text><rect class="b" x="420" y="166" width="270" height="78" rx="10"/><text class="bd" x="555" y="200.0" text-anchor="middle" font-size="14.5">遠い</text><text class="bd" x="555" y="220.0" text-anchor="middle" font-size="14.5">(相手は関心がないことが多い)</text><text class="bt" x="10" y="289.0" text-anchor="start" font-size="15">研修の期間</text><rect class="b" x="130" y="256" width="270" height="56" rx="10"/><text class="bd" x="265" y="289.0" text-anchor="middle" font-size="14.5">長くなる傾向</text><rect class="b" x="420" y="256" width="270" height="56" rx="10"/><text class="bd" x="555" y="289.0" text-anchor="middle" font-size="14.5">短期間で済むことが多い</text><text class="bt" x="10" y="357.0" text-anchor="start" font-size="15">指標の例</text><rect class="b" x="130" y="324" width="270" height="56" rx="10"/><text class="bd" x="265" y="357.0" text-anchor="middle" font-size="14.5">応答率、顧客満足度</text><rect class="b" x="420" y="324" width="270" height="56" rx="10"/><text class="bd" x="555" y="357.0" text-anchor="middle" font-size="14.5">架電数、アポ獲得率、成約率</text><text class="bd" x="10" y="414" text-anchor="start" font-size="13.5">※1社の解説による整理。調査に基づく数値ではない</text></svg>