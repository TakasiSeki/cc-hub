<svg class="figsvg" viewBox="0 0 700 340" role="img" aria-label="ダイヤルインと代表組の違い。ダイヤルインは1本の回線を複数の番号に振り分ける。代表組は複数の回線を1つの代表番号にまとめる。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-dialin-vs-group" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b head" x="10" y="10" width="330" height="44" rx="10"/><text class="bt" x="175.0" y="38.0" text-anchor="middle" font-size="18">ダイヤルイン</text><rect class="b head2" x="360" y="10" width="330" height="44" rx="10"/><text class="bt" x="525.0" y="38.0" text-anchor="middle" font-size="18">代表組</text><rect class="b" x="10" y="110" width="110" height="70" rx="10"/><text class="bt" x="65.0" y="151.0" text-anchor="middle" font-size="16">1本の回線</text><rect class="b" x="180" y="70" width="160" height="44" rx="10"/><text class="bt" x="260.0" y="98.0" text-anchor="middle" font-size="14.5">番号A → 営業部</text><line class="ar" x1="122" y1="145" x2="176" y2="92" marker-end="url(#ah-dialin-vs-group)"/><rect class="b" x="180" y="122" width="160" height="44" rx="10"/><text class="bt" x="260.0" y="150.0" text-anchor="middle" font-size="14.5">番号B → 経理部</text><line class="ar" x1="122" y1="145" x2="176" y2="144" marker-end="url(#ah-dialin-vs-group)"/><rect class="b" x="180" y="174" width="160" height="44" rx="10"/><text class="bt" x="260.0" y="202.0" text-anchor="middle" font-size="14.5">番号C → 総務部</text><line class="ar" x1="122" y1="145" x2="176" y2="196" marker-end="url(#ah-dialin-vs-group)"/><text class="bt" x="10" y="250" text-anchor="start" font-size="14.5">1つの回線を、複数の番号に振り分ける</text><text class="bd" x="10" y="274" text-anchor="start" font-size="14">・番号ごとに、担当者が直接受ける</text><text class="bd" x="10" y="296" text-anchor="start" font-size="14">・回線を増やすより、費用を抑えやすい</text><rect class="b" x="360" y="110" width="120" height="70" rx="10"/><text class="bt" x="420.0" y="151.0" text-anchor="middle" font-size="16">代表番号</text><rect class="b" x="560" y="70" width="130" height="44" rx="10"/><text class="bt" x="625.0" y="98.0" text-anchor="middle" font-size="14.5">回線1</text><line class="ar" x1="482" y1="145" x2="556" y2="92" marker-end="url(#ah-dialin-vs-group)"/><rect class="b" x="560" y="122" width="130" height="44" rx="10"/><text class="bt" x="625.0" y="150.0" text-anchor="middle" font-size="14.5">回線2</text><line class="ar" x1="482" y1="145" x2="556" y2="144" marker-end="url(#ah-dialin-vs-group)"/><rect class="b" x="560" y="174" width="130" height="44" rx="10"/><text class="bt" x="625.0" y="202.0" text-anchor="middle" font-size="14.5">回線3</text><line class="ar" x1="482" y1="145" x2="556" y2="196" marker-end="url(#ah-dialin-vs-group)"/><text class="bt" x="360" y="250" text-anchor="start" font-size="14.5">複数の回線を、1つの番号にまとめる</text><text class="bd" x="360" y="274" text-anchor="start" font-size="14">・空いている回線で応答する</text><text class="bd" x="360" y="296" text-anchor="start" font-size="14">・通話中になりにくい。顧客相談窓口などで使われる</text><text class="bd" x="10" y="328" text-anchor="start" font-size="13.5">※NTT東日本のコラムの整理。番号や部署の名前は例</text></svg>