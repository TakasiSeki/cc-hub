<svg class="figsvg" viewBox="0 0 700 360" role="img" aria-label="カスタマーハラスメント対応の流れ。現場の初期対応は、限定的に謝罪、状況の把握、上司や相談窓口への共有の3手順。その後、現場監督者、相談窓口、弁護士や警察へと連携する。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-harassment-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><text class="bt" x="10" y="22" text-anchor="start" font-size="16">現場での初期対応(3手順)</text><rect class="b" x="10" y="34" width="210" height="100" rx="10"/><text class="bt" x="115.0" y="58" text-anchor="middle" font-size="18">① 限定的に謝罪</text><text class="bd" x="115.0" y="80" text-anchor="middle" font-size="14.5">不快にさせた点に謝る</text><text class="bd" x="115.0" y="98" text-anchor="middle" font-size="14.5">(事実確認の前に</text><text class="bd" x="115.0" y="116" text-anchor="middle" font-size="14.5">非を認めない)</text><rect class="b" x="245" y="34" width="210" height="100" rx="10"/><text class="bt" x="350.0" y="58" text-anchor="middle" font-size="18">② 状況を把握</text><text class="bd" x="350.0" y="80" text-anchor="middle" font-size="14.5">話を遮らず、</text><text class="bd" x="350.0" y="98" text-anchor="middle" font-size="14.5">事実を確認する</text><rect class="b" x="480" y="34" width="210" height="100" rx="10"/><text class="bt" x="585.0" y="58" text-anchor="middle" font-size="18">③ 引き継ぐ</text><text class="bd" x="585.0" y="80" text-anchor="middle" font-size="14.5">現場監督者・</text><text class="bd" x="585.0" y="98" text-anchor="middle" font-size="14.5">相談窓口に共有する</text><line class="ar" x1="220" y1="84" x2="241" y2="84" marker-end="url(#ah-harassment-flow)"/><line class="ar" x1="455" y1="84" x2="476" y2="84" marker-end="url(#ah-harassment-flow)"/><text class="bt" x="10" y="176" text-anchor="start" font-size="16">社内の連携(本社・本部まで)</text><rect class="b" x="10" y="190" width="130" height="70" rx="10"/><text class="bt" x="75.0" y="214" text-anchor="middle" font-size="18">従業員</text><text class="bd" x="75.0" y="236" text-anchor="middle" font-size="14.5">対応した人</text><rect class="b" x="180" y="190" width="150" height="70" rx="10"/><text class="bt" x="255.0" y="214" text-anchor="middle" font-size="18">現場監督者</text><text class="bd" x="255.0" y="236" text-anchor="middle" font-size="14.5">(一次相談対応者)</text><rect class="b" x="370" y="190" width="150" height="70" rx="10"/><text class="bt" x="445.0" y="214" text-anchor="middle" font-size="18">相談窓口</text><text class="bd" x="445.0" y="236" text-anchor="middle" font-size="14.5">(本社・本部)</text><rect class="b" x="560" y="190" width="130" height="70" rx="10"/><text class="bt" x="625.0" y="214" text-anchor="middle" font-size="18">弁護士・警察</text><text class="bd" x="625.0" y="236" text-anchor="middle" font-size="14.5">相談・通報</text><line class="ar" x1="140" y1="225" x2="176" y2="225" marker-end="url(#ah-harassment-flow)"/><line class="ar" x1="330" y1="225" x2="366" y2="225" marker-end="url(#ah-harassment-flow)"/><line class="ar" x1="520" y1="225" x2="556" y2="225" marker-end="url(#ah-harassment-flow)"/><text class="bd" x="10" y="290" text-anchor="start" font-size="14.5">・明らかなカスハラは、一人で対応せず、すぐ上司に引き継ぐ</text><text class="bd" x="10" y="310" text-anchor="start" font-size="14.5">・録音・記録・時間の計測など、後から確認できる証拠を残す</text><text class="bd" x="10" y="330" text-anchor="start" font-size="14.5">・暴行、傷害、脅迫など、犯罪に当たる言動は、警察に通報する</text><text class="bd" x="10" y="350" text-anchor="start" font-size="13.5">※厚生労働省の企業マニュアルの内容を、事典の整理で図にしたもの</text></svg>