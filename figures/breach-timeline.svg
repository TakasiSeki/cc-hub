<svg class="figsvg" viewBox="0 0 700 360" role="img" aria-label="個人データの漏えい等の報告期限。発覚から3〜5日以内が目安で速報、30日以内に確報(不正の目的の場合は60日以内)。報告の対象は4つの場合。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-breach-timeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><line class="ar" x1="30" y1="90" x2="676" y2="90" marker-end="url(#ah-breach-timeline)"/><circle class="dot" cx="50" cy="90" r="7"/><text class="bt" x="50" y="62" text-anchor="middle" font-size="17">発覚</text><circle class="dot" cx="230" cy="90" r="7"/><text class="bt" x="230" y="62" text-anchor="middle" font-size="17">速報</text><text class="bd" x="230" y="124" text-anchor="middle" font-size="14.5">3〜5日以内が目安</text><circle class="dot" cx="430" cy="90" r="7"/><text class="bt" x="430" y="62" text-anchor="middle" font-size="17">確報</text><text class="bd" x="430" y="124" text-anchor="middle" font-size="14.5">30日以内</text><circle class="dot" cx="600" cy="90" r="7"/><text class="bt" x="600" y="62" text-anchor="middle" font-size="17">確報</text><text class="bd" x="600" y="124" text-anchor="middle" font-size="14.5">60日以内</text><text class="bd" x="600" y="144" text-anchor="middle" font-size="13">(不正の目的がある場合)</text><text class="bt" x="10" y="176" text-anchor="start" font-size="15">報告の対象になる場合(次のいずれか)</text><rect class="b" x="10" y="190" width="160" height="80" rx="10"/><text class="bd" x="90" y="224" text-anchor="middle" font-size="14.5">要配慮個人情報が</text><text class="bd" x="90" y="246" text-anchor="middle" font-size="14.5">含まれる</text><rect class="b" x="182" y="190" width="160" height="80" rx="10"/><text class="bd" x="262" y="224" text-anchor="middle" font-size="14.5">財産的被害の</text><text class="bd" x="262" y="246" text-anchor="middle" font-size="14.5">おそれがある</text><rect class="b" x="354" y="190" width="160" height="80" rx="10"/><text class="bd" x="434" y="224" text-anchor="middle" font-size="14.5">不正の目的の</text><text class="bd" x="434" y="246" text-anchor="middle" font-size="14.5">おそれがある</text><rect class="b" x="526" y="190" width="160" height="80" rx="10"/><text class="bd" x="606" y="224" text-anchor="middle" font-size="14.5">本人が1,000人を</text><text class="bd" x="606" y="246" text-anchor="middle" font-size="14.5">超える</text><text class="bd" x="10" y="302" text-anchor="start" font-size="14">・上の場合の漏えい等(またはそのおそれ)が起きたら、報告と本人への通知が義務</text><text class="bd" x="10" y="326" text-anchor="start" font-size="14">・上の「日数」は発覚日から数える。目盛りは正確な縮尺ではない</text><text class="bd" x="10" y="350" text-anchor="start" font-size="13">※個人情報保護委員会の案内をもとにした図。最新の案内は、委員会のページで確認が必要</text></svg>