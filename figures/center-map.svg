<svg class="figsvg" viewBox="0 0 700 420" role="img" aria-label="コンタクトセンターの業務種別の地図。インバウンドは受注、カスタマーサポート、テクニカルサポート、お客様相談室。アウトバウンドはテレアポ、テレマーケティング、インサイドセールス、調査・フォロー、督促。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-center-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b head" x="10" y="10" width="330" height="56" rx="10"/><text class="bt" x="175.0" y="34" text-anchor="middle" font-size="19">インバウンド(受信)</text><text class="bd" x="175" y="58" text-anchor="middle" font-size="14.5">顧客からの電話を受ける</text><rect class="b head2" x="360" y="10" width="330" height="56" rx="10"/><text class="bt" x="525.0" y="34" text-anchor="middle" font-size="19">アウトバウンド(発信)</text><text class="bd" x="525" y="58" text-anchor="middle" font-size="14.5">企業から顧客へ電話をかける</text><rect class="b" x="10" y="84" width="330" height="50" rx="10"/><text class="bt" x="175.0" y="108" text-anchor="middle" font-size="18">受注・申し込み</text><text class="bd" x="175.0" y="130" text-anchor="middle" font-size="14.5">通販の注文、予約・解約など</text><rect class="b" x="10" y="142" width="330" height="50" rx="10"/><text class="bt" x="175.0" y="166" text-anchor="middle" font-size="18">カスタマーサポート</text><text class="bd" x="175.0" y="188" text-anchor="middle" font-size="14.5">既存の利用者の問い合わせ</text><rect class="b" x="10" y="200" width="330" height="50" rx="10"/><text class="bt" x="175.0" y="224" text-anchor="middle" font-size="18">テクニカルサポート</text><text class="bd" x="175.0" y="246" text-anchor="middle" font-size="14.5">技術的な問い合わせ(二次対応が多い)</text><rect class="b" x="10" y="258" width="330" height="50" rx="10"/><text class="bt" x="175.0" y="282" text-anchor="middle" font-size="18">お客様相談室</text><text class="bd" x="175.0" y="304" text-anchor="middle" font-size="14.5">メーカーなどの問い合わせ窓口</text><rect class="b" x="360" y="84" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="108" text-anchor="middle" font-size="18">テレアポ</text><text class="bd" x="525.0" y="130" text-anchor="middle" font-size="14.5">商談(アポイント)を取る</text><rect class="b" x="360" y="142" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="166" text-anchor="middle" font-size="18">テレマーケティング</text><text class="bd" x="525.0" y="188" text-anchor="middle" font-size="14.5">既存顧客への調査・提案など(定義に幅あり)</text><rect class="b" x="360" y="200" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="224" text-anchor="middle" font-size="18">インサイドセールス</text><text class="bd" x="525.0" y="246" text-anchor="middle" font-size="14.5">見込み客と関係を作り、商談につなげる</text><rect class="b" x="360" y="258" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="282" text-anchor="middle" font-size="18">調査・フォロー</text><text class="bd" x="525.0" y="304" text-anchor="middle" font-size="14.5">アンケート、フォローコール</text><rect class="b" x="360" y="316" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="340" text-anchor="middle" font-size="18">督促</text><text class="bd" x="525.0" y="362" text-anchor="middle" font-size="14.5">支払いの案内</text><text class="bd" x="10" y="410" text-anchor="start" font-size="14.5">※呼び名や分類は、資料によって異なる。上は目安</text></svg>