<svg class="figsvg" viewBox="0 0 700 440" role="img" aria-label="総務省のテレワーク7方式。端末にデータを残さない4方式(リモートデスクトップ、VDI、セキュアコンテナ、セキュアブラウザ)と、残りうる3方式(VPN、クラウドサービス、スタンドアロン)。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-remote-methods" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b head" x="10" y="10" width="330" height="50" rx="10"/><text class="bt" x="175.0" y="41.0" text-anchor="middle" font-size="17">端末にデータを残さない方式</text><rect class="b head2" x="360" y="10" width="330" height="50" rx="10"/><text class="bt" x="525.0" y="41.0" text-anchor="middle" font-size="17">端末にデータが残りうる方式</text><rect class="b" x="10" y="76" width="330" height="56" rx="10"/><text class="bt" x="175.0" y="102" text-anchor="middle" font-size="17">リモートデスクトップ</text><text class="bd" x="175.0" y="126" text-anchor="middle" font-size="14.5">オフィスのPCを遠隔操作する</text><rect class="b" x="10" y="142" width="330" height="56" rx="10"/><text class="bt" x="175.0" y="168" text-anchor="middle" font-size="17">仮想デスクトップ(VDI)</text><text class="bd" x="175.0" y="192" text-anchor="middle" font-size="14.5">仮想デスクトップ基盤を遠隔操作する</text><rect class="b" x="10" y="208" width="330" height="56" rx="10"/><text class="bt" x="175.0" y="234" text-anchor="middle" font-size="17">セキュアコンテナ</text><text class="bd" x="175.0" y="258" text-anchor="middle" font-size="14.5">端末内の独立した仮想環境で動かす</text><rect class="b" x="10" y="274" width="330" height="56" rx="10"/><text class="bt" x="175.0" y="300" text-anchor="middle" font-size="17">セキュアブラウザ</text><text class="bd" x="175.0" y="324" text-anchor="middle" font-size="14.5">特殊なブラウザで社内システムに接続</text><rect class="b" x="360" y="76" width="330" height="56" rx="10"/><text class="bt" x="525.0" y="102" text-anchor="middle" font-size="17">VPN</text><text class="bd" x="525.0" y="126" text-anchor="middle" font-size="14.5">VPNでオフィスのネットワークに接続する</text><rect class="b" x="360" y="142" width="330" height="56" rx="10"/><text class="bt" x="525.0" y="168" text-anchor="middle" font-size="17">クラウドサービス</text><text class="bd" x="525.0" y="192" text-anchor="middle" font-size="14.5">クラウドサービスに直接接続する</text><rect class="b" x="360" y="208" width="330" height="56" rx="10"/><text class="bt" x="525.0" y="234" text-anchor="middle" font-size="17">スタンドアロン</text><text class="bd" x="525.0" y="258" text-anchor="middle" font-size="14.5">あらかじめ保存したデータで作業する</text><text class="bt" x="360" y="300" text-anchor="start" font-size="14.5">→ 端末の暗号化と、遠隔でのデータ消去が重要</text><text class="bd" x="10" y="360" text-anchor="start" font-size="14">・個人所有の端末(BYOD)は、マルウェア対策などを強制できず、十分に統制できない。</text><text class="bd" x="10" y="382" text-anchor="start" font-size="14">  リスクを受け入れられるか評価したうえで、使ってよいかを決める</text><text class="bd" x="10" y="428" text-anchor="start" font-size="13.5">※総務省「テレワークセキュリティガイドライン」第5版(令和3年5月)の7方式</text></svg>