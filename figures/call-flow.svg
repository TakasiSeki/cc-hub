<svg class="figsvg" viewBox="0 0 700 330" role="img" aria-label="電話がオペレーターに届くまでの流れ。顧客からIVR、ACD、オペレーターの順に進み、CTIが顧客情報を表示する。すぐつながらないときはコールバックがある。" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-call-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="10" y="30" width="90" height="100" rx="10"/><text class="bt" x="55.0" y="54" text-anchor="middle" font-size="18">顧客</text><text class="bd" x="55.0" y="76" text-anchor="middle" font-size="14.5">電話をかける</text><rect class="b" x="150" y="30" width="150" height="100" rx="10"/><text class="bt" x="225.0" y="54" text-anchor="middle" font-size="18">IVR</text><text class="bd" x="225.0" y="76" text-anchor="middle" font-size="14.5">ボタン操作や音声で</text><text class="bd" x="225.0" y="94" text-anchor="middle" font-size="14.5">ガイダンス・転送</text><rect class="b" x="330" y="30" width="150" height="100" rx="10"/><text class="bt" x="405.0" y="54" text-anchor="middle" font-size="18">ACD</text><text class="bd" x="405.0" y="76" text-anchor="middle" font-size="14.5">ルールで振り分け</text><text class="bd" x="405.0" y="94" text-anchor="middle" font-size="14.5">スキル・優先度・</text><text class="bd" x="405.0" y="112" text-anchor="middle" font-size="14.5">空き状況など</text><rect class="b" x="510" y="30" width="180" height="100" rx="10"/><text class="bt" x="600.0" y="54" text-anchor="middle" font-size="18">オペレーター</text><text class="bd" x="600.0" y="76" text-anchor="middle" font-size="14.5">電話に出て対応する</text><line class="ar" x1="100" y1="80" x2="146" y2="80" marker-end="url(#ah-call-flow)"/><line class="ar" x1="300" y1="80" x2="326" y2="80" marker-end="url(#ah-call-flow)"/><line class="ar" x1="480" y1="80" x2="506" y2="80" marker-end="url(#ah-call-flow)"/><rect class="b dash" x="310" y="190" width="190" height="86" rx="10"/><text class="bt" x="405.0" y="214" text-anchor="middle" font-size="16">すぐつながらないとき</text><text class="bd" x="405.0" y="236" text-anchor="middle" font-size="14.5">番号を残して後から</text><text class="bd" x="405.0" y="254" text-anchor="middle" font-size="14.5">折り返す(コールバック)</text><line class="ar da" x1="405" y1="130" x2="405" y2="186" marker-end="url(#ah-call-flow)"/><rect class="b dash" x="510" y="190" width="180" height="86" rx="10"/><text class="bt" x="600.0" y="214" text-anchor="middle" font-size="16">CTI</text><text class="bd" x="600.0" y="236" text-anchor="middle" font-size="14.5">着信時に顧客情報が</text><text class="bd" x="600.0" y="254" text-anchor="middle" font-size="14.5">画面に表示される</text><line class="ar da" x1="600" y1="186" x2="600" y2="134" marker-end="url(#ah-call-flow)"/><text class="bd" x="10" y="314" text-anchor="start" font-size="14.5">※おおむねの流れ。実際の構成は、センターや製品によって異なる</text></svg>