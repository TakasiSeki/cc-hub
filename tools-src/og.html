<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}

.logo{position:absolute;left:80px;top:80px;width:96px;height:96px;border-radius:24px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:44px;font-weight:800}

.sub{position:absolute;left:84px;top:350px;font-size:44px;font-weight:700;line-height:1.4}
.tags{position:absolute;left:84px;top:520px;display:flex;gap:16px}
.tags span{background:rgba(255,255,255,.2);border-radius:999px;padding:10px 26px;font-size:30px;font-weight:700}
.foot{position:absolute;right:80px;bottom:60px;font-size:28px;opacity:.85}

<div class="logo">CC</div>
<h1>CC Hub</h1>
<div class="sub">コンタクトセンターの<br>事典・ニュース・ツール</div>
<div class="tags"><span>通説と異論</span><span>出典つき</span><span>無料の計算ツール</span></div>
<div class="foot">コンタクトセンター・ハブ</div>
</body></html>
